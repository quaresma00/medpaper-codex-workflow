  "05_figures/code/*",
  "05_figures/out/*",
  "05_figures/qc/*",
  "06_refs/cache/**",
  "06_refs/fulltext/*",
  "06_refs/deepread/*.md",
  "07_manuscript/prepolish/*",
  "07_manuscript/polish_allowlist.tsv",
  "08_submission/cache/**",
  "08_submission/*.csl",
  "08_submission/bundle/**",
]

