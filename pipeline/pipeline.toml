[freeform]
globs = [
  "00_input/*",
  "02_data/raw/**",
  "02_data/acquisition/**",
  "02_data/derived/*",
  "03_analysis/code/*",
  "03_analysis/results/*.json",
  "04_tables/main/*.xlsx",
  "04_tables/supplementary/*.xlsx",
  "05_figures/code/*",
  "05_figures/out/*",
  "05_figures/qc/*",
  "06_refs/cache/**",
  "06_refs/fulltext/*",
  "06_refs/deepread/*.md",
  "07_manuscript/review_packages/*.zip",
  "08_submission/integration/**",
  "08_submission/journal_archives/**",
  "08_submission/cache/**",
  "08_submission/*.csl",
  "08_submission/bundle/**",
  "08_submission/evidence/**",
  "08_submission/releases/**",
  "01_protocol/prototypes/**",
]
